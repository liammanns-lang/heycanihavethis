<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ted's Hub</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="ted-bouncer.jpeg">

    <!-- This links the pixel font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('ted-bouncer.jpeg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Press Start 2P', cursive;
        }

        .main-container {
            background-color: rgba(0, 0, 0, 0.85); 
            padding: 40px 60px;
            border-radius: 15px;
            border: 6px solid #ffffff; 
            text-align: center;
            width: 85%;
            max-width: 1000px;
            margin-top: 50px;
            margin-bottom: 50px;
            box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.7); 
        }

        h1 {
            color: #ffffff;
            font-size: 32px; 
            line-height: 1.6;
            margin: 0 0 40px 0;
            text-shadow: 4px 4px 0px #000000;
            border-bottom: 4px dashed #ffffff; 
            padding-bottom: 20px;
        }

        h2 {
            color: #ff0055; 
            font-size: 18px;
            margin: 30px 0 20px 0;
            text-shadow: 2px 2px 0px #000000;
            text-transform: uppercase;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .arcade-btn {
            display: block;
            background-color: #111111;
            color: #00ff66; 
            text-decoration: none;
            padding: 15px 10px;
            font-size: 12px;
            border: 3px solid #00ff66;
            border-radius: 5px;
            text-shadow: 1px 1px 0px #000000;
            transition: all 0.2s ease;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
        }

        .arcade-btn:hover {
            background-color: #00ff66;
            color: #111111; 
            box-shadow: 0px 0px 15px #00ff66; 
            transform: scale(1.03); 
        }

        .cloak-select {
            background-color: #111111;
            color: #ffcc00; 
            border: 3px solid #ffcc00;
            padding: 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            display: block;
            text-align: center;
        }

        .cloak-select:hover {
            box-shadow: 0px 0px 15px #ffcc00;
        }
    </style>
</head>
<body><a href="settings.html">Go to Tab Settings</a>



</body>
</html>
