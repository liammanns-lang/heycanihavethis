<!DOCTYPE html>
<html>
<head>
    <!-- This links the pixel font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('ted-bouncer.jpeg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Moves the content up toward the top of the screen */
            font-family: 'Press Start 2P', cursive;
        }

        .title-box {
            background-color: rgba(0, 0, 0, 0.7); 
            padding: 50px 100px; /* Increased side padding to make the box much wider */
            border-radius: 15px;
            border: 6px solid #ffffff; 
            text-align: center;
            width: 85%; /* Forces the box to stretch wider across the screen */
            max-width: 1200px; /* Keeps it looking great on large computer monitors */
            margin-top: 80px; /* Controls exactly how high up the box sits from the top boundary */
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5); 
        }

        h1 {
            color: #ffffff;
            font-size: 38px; 
            line-height: 1.8;
            margin: 0;
            text-shadow: 4px 4px 0px #000000; 
        }
    </style>
</head>
<body>

    <div class="title-box">
        <h1>Ted's games/proxy's ig</h1>
    </div>

</body>
</html>
