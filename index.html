<!DOCTYPE html>
<html>
<head>
    <!-- This links the pixel font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('ted-bouncer.jpeg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive; /* Applies the pixel font */
        }

        .title-box {
            background-color: rgba(0, 0, 0, 0.6); /* Translucent dark box so text stands out */
            padding: 30px;
            border-radius: 10px;
            border: 4px solid #ffffff; /* White border around your title */
            text-align: center;
            max-width: 80%;
        }

        h1 {
            color: #ffffff; /* White text color */
            font-size: 24px;
            line-height: 1.6;
            margin: 0;
            text-shadow: 3px 3px 0px #000000; /* Adds a retro shadow behind letters */
        }
    </style>
</head>
<body>

    <div class="title-box">
        <h1>Ted's games/proxy's ig</h1>
    </div>

</body>
</html>
