<!DOCTYPE html>
<html>
<head>
    <!-- This links the pixel font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('ted-bouncer.jpeg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
        }

        .title-box {
            background-color: rgba(0, 0, 0, 0.7); /* Slightly darker for better text contrast */
            padding: 50px 60px; /* Increased padding inside the box */
            border-radius: 15px;
            border: 6px solid #ffffff; /* Thicker retro white border */
            text-align: center;
            max-width: 85%;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5); /* Soft drop shadow under the box */
        }

        h1 {
            color: #ffffff;
            font-size: 38px; /* Significantly increased from 24px */
            line-height: 1.8;
            margin: 0;
            text-shadow: 4px 4px 0px #000000; /* Thicker text shadow for a heavy retro feel */
        }
    </style>
</head>
<body>

    <div class="title-box">
        <h1>Ted's games/proxy's ig</h1>
    </div>

</body>
</html>
