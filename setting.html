<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <!-- Link to Font Awesome for the gear icon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        /* Gear Button Styling */
        .gear-button {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .gear-button:hover {
            transform: rotate(90deg);
            color: #00adb5;
        }

        /* Settings Container */
        .settings-container {
            max-width: 500px;
            margin: 60px auto 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: #00adb5;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #00adb5;
        }
    </style>
</head>
<body>

    <!-- Separate Gear Button at the Top Right -->
    <div class="gear-button" onclick="scrollToSettings()" title="Go to Settings">
        <i class="fas fa-cog"></i>
    </div>

    <!-- Settings Menu Options -->
    <div class="settings-container" id="settingsMenu">
        <h2><i class="fas fa-sliders-h"></i> Website Settings</h2>
        
        <div class="setting-group">
            <label for="cloakSelect">Select Tab Cloak:</label>
            <select id="cloakSelect" onchange="changeTabCloak()">
                <option value="default">Default (Game Site)</option>
                <option value="schoology">Schoology</option>
                <option value="ixl">IXL Learning</option>
                <option value="clever">Clever</option>
                <option value="google">New Tab</option>
            </select>
        </div>
    </div>

    <script>
        // Smooth scroll function for the gear button
        function scrollToSettings() {
            document.getElementById('settingsMenu').scrollIntoView({ behavior: 'smooth' });
        }

        // Configuration mapping for preset sites
        const cloakPresets = {
            default: {
                title: "My Game Website",
                favicon: "ted-bouncer.jpeg" // Keeps your repo's bouncer image
            },
            schoology: {
                title: "Home | Schoology",
                favicon: "https://schoology.com"
            },
            ixl: {
                title: "IXL | Dashboard",
                favicon: "https://ixl.com"
            },
            clever: {
                title: "Clever | Portal",
                favicon: "https://clever.com"
            },
            google: {
                title: "New Tab",
                favicon: "https://google.com"
            }
        };

        // Function to change title and icon dynamically
        function changeTabCloak() {
            const selectValue = document.getElementById('cloakSelect').value;
            const selectedPreset = cloakPresets[selectValue];

            if (selectedPreset) {
                // Update the document title
                document.title = selectedPreset.title;

                // Find or create the favicon element
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.getElementsByTagName('head')[0].appendChild(link);
                }
                
                // Update the favicon link URL
                link.href = selectedPreset.favicon;

                // Save selection to LocalStorage so it persists across page reloads
                localStorage.setItem('savedCloak', selectValue);
            }
        }

        // Automatically load saved cloak preference when the window finishes loading
        window.onload = function() {
            const savedCloak = localStorage.getItem('savedCloak');
            if (savedCloak) {
                document.getElementById('cloakSelect').value = savedCloak;
                changeTabCloak();
            }
        };
    </script>

</body>
</html>
